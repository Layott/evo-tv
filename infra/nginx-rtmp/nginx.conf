worker_processes auto;
events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Callback to the Next.js app running on the host.
            # Validates stream key + flips is_live on the streams row.
            # Port must match `pnpm dev` / `pnpm start`, which are pinned to
            # 3060. This said 3000 and so every publish was rejected: nginx
            # treats a failed callback as "deny", so OBS could not connect at
            # all and nothing in the app ever heard about it.
            on_publish http://host.docker.internal:3060/api/rtmp/on-publish;
            on_publish_done http://host.docker.internal:3060/api/rtmp/on-publish-done;

            # HLS output for viewers.
            hls on;
            hls_path /var/hls;
            hls_fragment 2s;

            # The quality ladder. Kept identical to deploy/nginx-rtmp.conf so a
            # local rehearsal proves the same thing production will do; see that
            # file for why the rungs exist and why this box never transcodes.
            hls_variant _low BANDWIDTH=1000000,RESOLUTION=640x360;
            hls_variant _mid BANDWIDTH=1800000,RESOLUTION=854x480;
            hls_variant _hi  BANDWIDTH=3200000,RESOLUTION=1280x720;
            # DVR window. This was 10s, so the manifest listed five segments and
            # a viewer had nothing to rewind into: the skip-back button moved
            # inside a five second buffer and then hit the wall. 5 minutes is
            # 150 segments on disk per stream, roughly 100 MB at 2500 kbps,
            # which hls_cleanup reclaims as they age out.
            hls_playlist_length 300s;
            hls_cleanup on;
        }
    }
}

http {
    server {
        listen 8080;

        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var;

            # Local dev only: nothing sits in front of nginx here, so it owns
            # these. In production Caddy sets them and this block is empty, to
            # avoid duplicate headers, which browsers reject. Keep the two files
            # in step on everything else.
            add_header Cache-Control "no-cache" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location /stat {
            rtmp_stat all;
        }
    }
}
