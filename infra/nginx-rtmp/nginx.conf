worker_processes auto;
events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Callback to the Next.js app running on the host.
            # Validates stream key + flips is_live on the streams row.
            on_publish http://host.docker.internal:3000/api/rtmp/on-publish;
            on_publish_done http://host.docker.internal:3000/api/rtmp/on-publish-done;

            # HLS output for viewers.
            hls on;
            hls_path /var/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_cleanup on;
        }
    }
}

http {
    server {
        listen 8080;

        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var;
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "*";
        }

        location /stat {
            rtmp_stat all;
        }
    }
}
