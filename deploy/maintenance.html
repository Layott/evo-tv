<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EVO TV is updating</title>
    <style>
      /*
       * Served by Caddy when no API container answers, which happens for a few
       * seconds during a deploy and for longer if something is genuinely wrong.
       * Standalone on purpose: it has to render when the application that
       * normally serves the CSS is the thing that is down.
       */
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05191b;
        color: #e8f4f4;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      main { max-width: 30rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 0.5rem; color: #9fbdbd; line-height: 1.55; font-size: 0.95rem; }
      .dot {
        display: inline-block;
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #46e3ce;
        margin-right: 8px;
        vertical-align: middle;
      }
      .card {
        background: #0b2426;
        border-radius: 16px;
        padding: 28px 24px;
      }
      .note { margin-top: 18px; font-size: 0.8rem; color: #6f8f8f; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1><span class="dot"></span>EVO TV is updating</h1>
      <p>
        A new version is going out. This takes a minute or two, and nothing you
        were watching or bought is affected.
      </p>
      <p>This page reloads by itself when the site is back.</p>
      <p class="note">If it is still here in five minutes, something has gone wrong rather than slow.</p>
    </main>
    <script>
      // Poll the health endpoint rather than reloading blindly: a reload every
      // few seconds during a long deploy is a request storm against a server
      // that is already busy coming back up.
      const check = () => {
        fetch("/api/health", { cache: "no-store" })
          .then((r) => { if (r.ok) location.reload(); })
          .catch(() => {});
      };
      setInterval(check, 5000);
    </script>
  </body>
</html>
