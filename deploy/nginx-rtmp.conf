# Production nginx-rtmp. Mounted at /etc/nginx/nginx.conf by
# deploy/docker-compose.yml under the `rtmp` profile.
#
# The local twin is infra/nginx-rtmp/nginx.conf; they differ only in where
# the on_publish callback points. Keep them in step.
worker_processes auto;
events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Callback to the app over the compose network. `api-1` is the
            # service name; the container listens on 3000 internally whatever
            # the published port is.
            # Validates stream key + flips is_live on the streams row.
            # Port must match `pnpm dev` / `pnpm start`, which are pinned to
            # 3060. This said 3000 and so every publish was rejected: nginx
            # treats a failed callback as "deny", so OBS could not connect at
            # all and nothing in the app ever heard about it.
            on_publish http://api-1:3000/api/rtmp/on-publish;
            on_publish_done http://api-1:3000/api/rtmp/on-publish-done;

            # HLS output for viewers.
            hls on;
            hls_path /var/hls;
            hls_fragment 2s;
            hls_playlist_length 10s;
            hls_cleanup on;
        }
    }
}

http {
    server {
        listen 8080;

        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var;
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "*";
        }

        location /stat {
            rtmp_stat all;
        }
    }
}
