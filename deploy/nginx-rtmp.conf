# Production nginx-rtmp. Mounted at /etc/nginx/nginx.conf by
# deploy/docker-compose.yml under the `rtmp` profile.
#
# The local twin is infra/nginx-rtmp/nginx.conf; they differ only in where
# the on_publish callback points. Keep them in step.
worker_processes auto;
events { worker_connections 1024; }

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Callback to the app over the compose network.
            #
            # 3060, not 3000. The app is pinned to 3060 everywhere, including
            # inside the container: Caddy proxies to api-1:3060. This said 3000,
            # so nginx got "connection refused" on every publish, and because a
            # failed on_publish callback means deny, OBS reported "could not
            # access the specified channel or stream key". That reads as a bad
            # key and has nothing to do with the key.
            # Validates stream key + flips is_live on the streams row.
            # Port must match `pnpm dev` / `pnpm start`, which are pinned to
            # 3060. This said 3000 and so every publish was rejected: nginx
            # treats a failed callback as "deny", so OBS could not connect at
            # all and nothing in the app ever heard about it.
            on_publish http://api-1:3060/api/rtmp/on-publish;
            on_publish_done http://api-1:3060/api/rtmp/on-publish-done;

            # HLS output for viewers.
            hls on;
            hls_path /var/hls;
            hls_fragment 2s;

            # ---------------------------------------------------------------
            # The quality ladder.
            #
            # Until this existed the channel went out as a single ~2,667 kbps
            # rendition, which meant a viewer who could not hold 2.7 Mbps had
            # nothing to fall back to and simply stalled. For a mobile-first
            # Nigerian audience that is most of them, and no amount of player
            # buffering can fix it: the bytes are not arriving fast enough to
            # play at all.
            #
            # This box does NOT transcode. nginx repackages whatever the
            # encoder sends, so the office pushes three streams and the server
            # cost stays flat as viewers arrive. That property is the whole
            # reason self-hosting is affordable here, and running `exec ffmpeg`
            # to make the rungs on this 2 vCPU droplet would destroy it.
            #
            # The encoder publishes <streamId>_low, _mid and _hi. nginx strips
            # the suffix and writes a master playlist at <streamId>.m3u8 that
            # lists all three, so the playback URL viewers already have keeps
            # working and simply gains rungs.
            #
            # BANDWIDTH is peak including audio, which is what a player uses to
            # decide it cannot afford a rung. Understating it makes players
            # pick a stream they cannot sustain, which is the exact failure
            # this is meant to end.
            #
            # These are set from what the encoder actually sends, measured off
            # the live segments, not from what it was asked to send. The first
            # values were the targets, and every rung overshot them: 400 became
            # 808, 900 became 1520, and even 2200 came out at 2749, so all three
            # were advertised below their real cost and the playlist was quietly
            # lying to every player reading it.
            #
            # Re-measure and update these whenever the encoder settings change.
            # A rung that costs more than it claims is worse than no rung, since
            # a phone picks it on the strength of the promise and then stalls.
            hls_variant _low BANDWIDTH=1000000,RESOLUTION=640x360;
            hls_variant _mid BANDWIDTH=1800000,RESOLUTION=854x480;
            hls_variant _hi  BANDWIDTH=3200000,RESOLUTION=1280x720;
            # 1080p. Advertised above what the encoder is asked for, like the
            # rungs above it, because a rung that costs more than it claims
            # makes a phone pick it and then stall.
            #
            # A viewer on this rung costs roughly seven times a 360p viewer
            # against the 4 TB allowance, which is why playback gates it behind
            # Premium through the existing maxHeight entitlement. nginx serves
            # whoever asks; the entitlement decides who is offered it.
            hls_variant _fhd BANDWIDTH=5600000,RESOLUTION=1920x1080;
            # ---------------------------------------------------------------
            # DVR window. This was 10s, so the manifest listed five segments and
            # a viewer had nothing to rewind into: the skip-back button moved
            # inside a five second buffer and then hit the wall. 5 minutes is
            # 150 segments on disk per stream, roughly 100 MB at 2500 kbps,
            # which hls_cleanup reclaims as they age out.
            hls_playlist_length 300s;
            hls_cleanup on;
        }
    }
}

http {
    server {
        listen 8080;

        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var;

            # No CORS or cache headers here. Caddy sits in front and sets both,
            # and add_header does not replace, it appends: the response left
            # with two Access-Control-Allow-Origin headers and two contradictory
            # Cache-Control headers.
            #
            # A browser treats duplicate Access-Control-Allow-Origin as invalid
            # and blocks the response outright, so hls.js could not read the
            # manifest and sat retrying forever behind a spinner. curl accepts
            # it happily, which is why this survived every command-line check.
        }

        location /stat {
            rtmp_stat all;
        }
    }
}
